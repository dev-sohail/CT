services:
  app:
    build:
      context: ../apps/api
      dockerfile: ../../infra/docker/Dockerfile
    container_name: ctlab-app
    working_dir: /var/www
    volumes:
      - ../apps/api:/var/www
    depends_on:
      - db
      - redis
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_DATABASE: ctlab
      DB_USERNAME: ctlab
      DB_PASSWORD: secret
      REDIS_HOST: redis
    expose:
      - "9000"

  nginx:
    image: nginx:1.25-alpine
    container_name: ctlab-nginx
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - ../apps/api:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: ctlab-db
    environment:
      MYSQL_DATABASE: ctlab
      MYSQL_USER: ctlab
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - ctlab-db-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ctlab-redis
    ports:
      - "6379:6379"
    volumes:
      - ctlab-redis-data:/data
    restart: unless-stopped

volumes:
  ctlab-db-data:
  ctlab-redis-data:
